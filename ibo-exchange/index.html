<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ibo-logo.png?v=18" sizes="32x32" />
    <link rel="icon" type="image/png" href="/ibo-logo.png?v=18" sizes="48x48" />
    <link rel="shortcut icon" type="image/png" href="/ibo-logo.png?v=18" />
    <link rel="apple-touch-icon" href="/ibo-logo.png?v=18" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F4F6" />
    <title>Delta Exchange — Trade Crypto</title>
    <meta name="description" content="Delta Exchange — Next-generation centralized crypto exchange. Futures, options, and Delta markets for crypto traders." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var KEY = 'ibo-exchange-theme-v3';
          var t = localStorage.getItem(KEY);
          if (t !== 'light' && t !== 'dark') {
            try {
              localStorage.removeItem('ibo-exchange-theme-v2');
              localStorage.removeItem('ibo-exchange-theme');
            } catch (e) {}
            t = 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          root.style.colorScheme = t;
          root.classList.remove('light', 'dark');
          root.classList.add(t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
